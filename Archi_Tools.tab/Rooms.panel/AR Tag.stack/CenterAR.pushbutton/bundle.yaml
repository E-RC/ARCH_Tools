title: "Center A/R"
author: "Archiplan-ER"
tooltip: |
  Centra automáticamente las Habitaciones (Rooms) o Áreas seleccionadas.
  
  Instrucciones:
  1. Seleccione en el modelo las Habitaciones o Áreas que desea organizar.
  2. Haga clic en este botón.
  
  El punto de ubicación de cada elemento se moverá al centro de su contorno.
